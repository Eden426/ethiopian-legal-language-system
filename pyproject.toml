[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiopian-legal-language-system"
version = "0.1.0"
description = "Research pipeline for Amharic-English legal MT and bilingual retrieval"
requires-python = ">=3.10,<3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

